{% extends "base.html" %}

{% block title %}Task Monitor - Blog2MD{% endblock %}

{% block content %}
<div class="max-w-5xl mx-auto space-y-8">
    
    <!-- Header -->
    <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-6 pb-6 border-b border-gray-200 dark:border-gray-800">
        <div class="space-y-2">
            <h1 class="text-3xl sm:text-4xl font-bold tracking-tight text-gray-900 dark:text-white font-display">
                System Monitor
            </h1>
            <p class="text-lg text-gray-500 dark:text-gray-400 max-w-2xl">
                Manage background tasks and view processing status.
            </p>
        </div>
        <div class="flex items-center gap-3 bg-white dark:bg-gray-800 p-1.5 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700">
            <label for="concurrency" class="text-sm font-medium text-gray-600 dark:text-gray-300 pl-2">Concurrency:</label>
            <div class="flex items-center gap-2">
                <input type="number" id="concurrency" min="1" max="10" value="2" 
                    class="w-16 text-center rounded-lg border-gray-300 shadow-sm focus:border-primary-500 focus:ring-primary-500 sm:text-sm dark:bg-gray-900 dark:border-gray-600 dark:text-white transition-colors">
                <button onclick="updateConcurrency()" 
                    class="px-3 py-1.5 text-sm font-medium text-primary-600 bg-primary-50 hover:bg-primary-100 dark:text-primary-400 dark:bg-primary-900/30 dark:hover:bg-primary-900/50 rounded-lg transition-colors">
                    Set
                </button>
            </div>
        </div>
    </div>

    <!-- Main Content Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
        
        <!-- Left Column: Submit Tasks -->
        <div class="lg:col-span-1">
            <div class="glass rounded-2xl border border-gray-200/50 dark:border-gray-700/50 p-6 shadow-sm sticky top-24">
                <h2 class="text-lg font-display font-bold text-gray-900 dark:text-white mb-4 flex items-center gap-2">
                    <svg class="w-5 h-5 text-primary-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    New Task
                </h2>
                <div class="space-y-4">
                    <div>
                        <label for="urls" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                            Article URLs <span class="text-gray-400 font-normal">(one per line)</span>
                        </label>
                        <textarea id="urls" rows="6" 
                            class="block w-full rounded-xl border-gray-300 shadow-sm focus:border-primary-500 focus:ring-primary-500 sm:text-sm dark:bg-gray-800/50 dark:border-gray-600 dark:text-white font-mono leading-normal resize-none transition-colors" 
                            placeholder="https://example.com/article-1&#10;https://example.com/article-2"></textarea>
                    </div>
                    <button onclick="submitTasks()" 
                        class="w-full inline-flex justify-center items-center gap-2 rounded-xl border border-transparent bg-primary-600 py-2.5 px-4 text-sm font-medium text-white shadow-sm hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2 transition-all hover:shadow-md active:scale-95">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                        Submit Tasks
                    </button>
                </div>
            </div>
        </div>

        <!-- Right Column: Task Queue -->
        <div class="lg:col-span-3">
            <div class="bg-white/60 dark:bg-gray-800/60 backdrop-blur-md rounded-2xl border border-gray-200 dark:border-gray-700 shadow-sm overflow-hidden">
                <div class="px-6 py-4 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center bg-gray-50/50 dark:bg-gray-800/50">
                    <h2 class="text-lg font-display font-bold text-gray-900 dark:text-white flex items-center gap-2">
                        <svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
                        Task Queue
                    </h2>
                    <span id="queue-stats" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-gray-100 text-gray-800 dark:bg-gray-700 dark:text-gray-300">
                        Syncing...
                    </span>
                </div>
                
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200 dark:divide-gray-700">
                        <thead class="bg-gray-50/80 dark:bg-gray-900/80">
                            <tr>
                                <th scope="col" class="px-4 py-3 text-left text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider">Status</th>
                                <th scope="col" class="px-4 py-3 text-left text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider">URL</th>
                                <th scope="col" class="px-4 py-3 text-left text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider">Created</th>
                                <th scope="col" class="px-4 py-3 text-right text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider">Task ID</th>
                            </tr>
                        </thead>
                        <tbody id="task-table-body" class="bg-transparent divide-y divide-gray-200 dark:divide-gray-700">
                            <!-- Rows will be populated here -->
                        </tbody>
                    </table>
                </div>
                
                <!-- Empty State (Hidden by default) -->
                <div id="empty-state" class="hidden py-12 flex flex-col items-center justify-center text-center">
                    <svg class="w-12 h-12 text-gray-300 dark:text-gray-600 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path></svg>
                    <p class="text-gray-500 dark:text-gray-400 text-sm">No tasks in queue</p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Toast Notification -->
<div id="toast" class="fixed bottom-5 right-5 transform translate-y-20 opacity-0 transition-all duration-300 z-50">
    <div class="bg-gray-900 dark:bg-white text-white dark:text-gray-900 px-4 py-3 rounded-lg shadow-lg flex items-center gap-3">
        <span id="toast-icon"></span>
        <span id="toast-message" class="text-sm font-medium"></span>
    </div>
</div>

<script>
    // --- Helper Functions ---
    function getStatusBadge(status) {
        const classes = {
            'pending': 'bg-gray-100 text-gray-600 dark:bg-gray-700/50 dark:text-gray-400 ring-1 ring-inset ring-gray-500/10',
            'running': 'bg-blue-50 text-blue-700 dark:bg-blue-900/20 dark:text-blue-400 ring-1 ring-inset ring-blue-700/10 animate-pulse',
            'completed': 'bg-emerald-50 text-emerald-700 dark:bg-emerald-900/20 dark:text-emerald-400 ring-1 ring-inset ring-emerald-600/20',
            'failed': 'bg-rose-50 text-rose-700 dark:bg-rose-900/20 dark:text-rose-400 ring-1 ring-inset ring-rose-600/10'
        };
        const icons = {
            'pending': '<svg class="w-3 h-3 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>',
            'running': '<svg class="w-3 h-3 mr-1 animate-spin" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>',
            'completed': '<svg class="w-3 h-3 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>',
            'failed': '<svg class="w-3 h-3 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>'
        };
        
        const statusKey = status.toLowerCase();
        const cls = classes[statusKey] || classes['pending'];
        const icon = icons[statusKey] || icons['pending'];
        
        return `<span class="inline-flex items-center px-2 py-1 rounded-md text-xs font-medium ${cls}">${icon}${status}</span>`;
    }

    function formatDate(isoString) {
        if (!isoString) return '-';
        const date = new Date(isoString);
        return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }
    
    function showToast(message, type = 'info') {
        const toast = document.getElementById('toast');
        const msgEl = document.getElementById('toast-message');
        const iconEl = document.getElementById('toast-icon');
        
        msgEl.textContent = message;
        
        if (type === 'success') {
            iconEl.innerHTML = '<svg class="w-5 h-5 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>';
        } else if (type === 'error') {
            iconEl.innerHTML = '<svg class="w-5 h-5 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>';
        } else {
            iconEl.innerHTML = '<svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>';
        }
        
        toast.classList.remove('translate-y-20', 'opacity-0');
        
        setTimeout(() => {
            toast.classList.add('translate-y-20', 'opacity-0');
        }, 3000);
    }

    // --- API Calls ---
    async function loadTasks() {
        try {
            const res = await fetch('/api/tasks');
            const tasks = await res.json();
            renderTasks(tasks);
        } catch (e) {
            console.error("Failed to load tasks", e);
        }
    }
    
    function renderTasks(tasks) {
        const tbody = document.getElementById('task-table-body');
        const statsEl = document.getElementById('queue-stats');
        const emptyState = document.getElementById('empty-state');
        
        // Update stats
        const pending = tasks.filter(t => t.status === 'pending').length;
        const running = tasks.filter(t => t.status === 'running').length;
        statsEl.textContent = `${running} Running · ${pending} Pending`;
        
        tbody.innerHTML = '';
        
        if (tasks.length === 0) {
            emptyState.classList.remove('hidden');
        } else {
            emptyState.classList.add('hidden');
            
            // Sort: running first, then pending, then completed/failed (newest first)
            tasks.sort((a, b) => {
                const priority = { 'running': 0, 'pending': 1, 'failed': 2, 'completed': 3 };
                const pA = priority[a.status] || 4;
                const pB = priority[b.status] || 4;
                if (pA !== pB) return pA - pB;
                return new Date(b.created_at) - new Date(a.created_at);
            });

            tasks.forEach(task => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-50 dark:hover:bg-gray-800/50 transition-colors group';
                tr.innerHTML = `
                    <td class="px-4 py-4 whitespace-nowrap">
                        ${getStatusBadge(task.status)}
                    </td>
                    <td class="px-4 py-4">
                        <div class="text-sm font-medium text-gray-900 dark:text-white truncate max-w-xs" title="${task.url}">
                            ${task.url}
                        </div>
                    </td>
                    <td class="px-4 py-4 whitespace-nowrap text-sm text-gray-500 dark:text-gray-400">
                        ${formatDate(task.created_at)}
                    </td>
                    <td class="px-4 py-4 whitespace-nowrap text-right text-xs font-mono text-gray-400 group-hover:text-gray-600 dark:group-hover:text-gray-300 transition-colors">
                        ${task.id.substring(0, 8)}
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }
    }

    async function updateConcurrency() {
        const val = parseInt(document.getElementById('concurrency').value);
        if (val < 1 || val > 10) {
            showToast("Concurrency must be between 1 and 10", 'error');
            return;
        }
        
        const btn = document.querySelector('button[onclick="updateConcurrency()"]');
        const originalText = btn.textContent;
        btn.textContent = 'Saving...';
        btn.disabled = true;
        
        try {
            const res = await fetch('/api/settings/concurrency', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({concurrency: val})
            });
            const data = await res.json();
            
            if (!res.ok) {
                showToast(data.detail || "Failed to update concurrency", 'error');
                return;
            }
            
            if (data.status === 'updated') {
                showToast(`Concurrency set to ${data.concurrency}`, 'success');
            }
        } catch (e) {
            showToast("Failed to update concurrency", 'error');
        } finally {
            btn.textContent = originalText;
            btn.disabled = false;
        }
    }

    async function submitTasks() {
        const textarea = document.getElementById('urls');
        const rawUrls = textarea.value;
        const urls = rawUrls.split('\n').map(u => u.trim()).filter(u => u.length > 0);
        
        if (urls.length === 0) {
            showToast("Please enter at least one URL", 'error');
            return;
        }
        
        const btn = document.querySelector('button[onclick="submitTasks()"]');
        const originalHTML = btn.innerHTML;
        btn.innerHTML = '<svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Processing...';
        btn.disabled = true;

        try {
            const res = await fetch('/api/tasks', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({urls: urls})
            });
            const data = await res.json();
            showToast(`Submitted ${data.tasks.length} tasks`, 'success');
            textarea.value = '';
            loadTasks();
        } catch (e) {
            showToast("Failed to submit tasks", 'error');
        } finally {
            btn.innerHTML = originalHTML;
            btn.disabled = false;
        }
    }

    // Auto-refresh tasks every 3 seconds
    loadTasks();
    setInterval(loadTasks, 3000);
</script>
{% endblock %}

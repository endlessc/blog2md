<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Blog2MD{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap');

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #475569; 
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
        .dark ::-webkit-scrollbar-thumb:hover {
            background: #64748b; 
        }
        
        /* Markdown overrides for better light/dark consistency */
        .markdown-body img {
            max-width: 100%;
            border-radius: 0.75rem;
            margin: 1.5rem 0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        
        /* Smooth theme transition */
        body, .bg-white, .bg-gray-900, .text-gray-900, .text-gray-100 {
            transition-property: color, background-color, border-color, text-decoration-color, fill, stroke;
            transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
            transition-duration: 200ms;
        }

        /* Modern Background Pattern */
        .bg-grid-pattern {
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 24px 24px;
        }
        .dark .bg-grid-pattern {
            background-image: radial-gradient(#334155 1px, transparent 1px);
        }
        
        /* Glassmorphism utilities */
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .dark .glass {
            background: rgba(17, 24, 39, 0.7);
        }

        /* Syntax Highlighting (Monokai-like) & Code Block Fixes */
        .prose pre code {
            background-color: transparent !important;
            color: inherit;
            padding: 0;
            border-radius: 0;
            font-weight: inherit;
        }
        
        /* Pygments Syntax Highlighting (Light Mode - friendly) */
        .codehilite { background: #f8f9fa; border-radius: 0.5rem; padding: 1em; overflow-x: auto; }
        .codehilite .hll { background-color: #ffffcc }
        .codehilite .c { color: #60A0B0; font-style: italic } /* Comment */
        .codehilite .err { border: 1px solid #FF0000 } /* Error */
        .codehilite .k { color: #007020; font-weight: bold } /* Keyword */
        .codehilite .o { color: #666666 } /* Operator */
        .codehilite .ch { color: #60A0B0; font-style: italic } /* Comment.Hashbang */
        .codehilite .cm { color: #60A0B0; font-style: italic } /* Comment.Multiline */
        .codehilite .cp { color: #007020 } /* Comment.Preproc */
        .codehilite .cpf { color: #60A0B0; font-style: italic } /* Comment.PreprocFile */
        .codehilite .c1 { color: #60A0B0; font-style: italic } /* Comment.Single */
        .codehilite .cs { color: #60A0B0; background-color: #fff0f0 } /* Comment.Special */
        .codehilite .gd { color: #A00000 } /* Generic.Deleted */
        .codehilite .ge { font-style: italic } /* Generic.Emph */
        .codehilite .ges { font-weight: bold; font-style: italic } /* Generic.EmphStrong */
        .codehilite .gr { color: #FF0000 } /* Generic.Error */
        .codehilite .gh { color: #000080; font-weight: bold } /* Generic.Heading */
        .codehilite .gi { color: #00A000 } /* Generic.Inserted */
        .codehilite .go { color: #888888 } /* Generic.Output */
        .codehilite .gp { color: #c65d09; font-weight: bold } /* Generic.Prompt */
        .codehilite .gs { font-weight: bold } /* Generic.Strong */
        .codehilite .gu { color: #800080; font-weight: bold } /* Generic.Subheading */
        .codehilite .gt { color: #0044DD } /* Generic.Traceback */
        .codehilite .kc { color: #007020; font-weight: bold } /* Keyword.Constant */
        .codehilite .kd { color: #007020; font-weight: bold } /* Keyword.Declaration */
        .codehilite .kn { color: #007020; font-weight: bold } /* Keyword.Namespace */
        .codehilite .kp { color: #007020 } /* Keyword.Pseudo */
        .codehilite .kr { color: #007020; font-weight: bold } /* Keyword.Reserved */
        .codehilite .kt { color: #902000 } /* Keyword.Type */
        .codehilite .m { color: #40a070 } /* Literal.Number */
        .codehilite .s { color: #4070a0 } /* Literal.String */
        .codehilite .na { color: #4070a0 } /* Name.Attribute */
        .codehilite .nb { color: #007020 } /* Name.Builtin */
        .codehilite .nc { color: #0e84b5; font-weight: bold } /* Name.Class */
        .codehilite .no { color: #60add5 } /* Name.Constant */
        .codehilite .nd { color: #555555; font-weight: bold } /* Name.Decorator */
        .codehilite .ni { color: #d55537; font-weight: bold } /* Name.Entity */
        .codehilite .ne { color: #007020 } /* Name.Exception */
        .codehilite .nf { color: #06287e } /* Name.Function */
        .codehilite .nl { color: #002070; font-weight: bold } /* Name.Label */
        .codehilite .nn { color: #0e84b5; font-weight: bold } /* Name.Namespace */
        .codehilite .nt { color: #062873; font-weight: bold } /* Name.Tag */
        .codehilite .nv { color: #bb60d5 } /* Name.Variable */
        .codehilite .ow { color: #007020; font-weight: bold } /* Operator.Word */
        .codehilite .w { color: #bbbbbb } /* Text.Whitespace */
        .codehilite .mb { color: #40a070 } /* Literal.Number.Bin */
        .codehilite .mf { color: #40a070 } /* Literal.Number.Float */
        .codehilite .mh { color: #40a070 } /* Literal.Number.Hex */
        .codehilite .mi { color: #40a070 } /* Literal.Number.Integer */
        .codehilite .mo { color: #40a070 } /* Literal.Number.Oct */
        .codehilite .sa { color: #4070a0 } /* Literal.String.Affix */
        .codehilite .sb { color: #4070a0 } /* Literal.String.Backtick */
        .codehilite .sc { color: #4070a0 } /* Literal.String.Char */
        .codehilite .dl { color: #4070a0 } /* Literal.String.Delimiter */
        .codehilite .sd { color: #4070a0; font-style: italic } /* Literal.String.Doc */
        .codehilite .s2 { color: #4070a0 } /* Literal.String.Double */
        .codehilite .se { color: #4070a0; font-weight: bold } /* Literal.String.Escape */
        .codehilite .sh { color: #4070a0 } /* Literal.String.Heredoc */
        .codehilite .si { color: #70a0d0; font-style: italic } /* Literal.String.Interpol */
        .codehilite .sx { color: #c65d09 } /* Literal.String.Other */
        .codehilite .sr { color: #235388 } /* Literal.String.Regex */
        .codehilite .s1 { color: #4070a0 } /* Literal.String.Single */
        .codehilite .ss { color: #517918 } /* Literal.String.Symbol */
        .codehilite .bp { color: #007020 } /* Name.Builtin.Pseudo */
        .codehilite .fm { color: #06287e } /* Name.Function.Magic */
        .codehilite .vc { color: #bb60d5 } /* Name.Variable.Class */
        .codehilite .vg { color: #bb60d5 } /* Name.Variable.Global */
        .codehilite .vi { color: #bb60d5 } /* Name.Variable.Instance */
        .codehilite .vm { color: #bb60d5 } /* Name.Variable.Magic */
        .codehilite .il { color: #40a070 } /* Literal.Number.Integer.Long */

        /* Dark Mode Overrides (Monokai) */
        .dark .codehilite { background: #1e1e1e; }
        .dark .codehilite .hll { background-color: #49483e }
        .dark .codehilite .c { color: #75715e } /* Comment */
        .dark .codehilite .err { color: #960050; background-color: #1e0010 } /* Error */
        .dark .codehilite .k { color: #66d9ef } /* Keyword */
        .dark .codehilite .l { color: #ae81ff } /* Literal */
        .dark .codehilite .n { color: #f8f8f2 } /* Name */
        .dark .codehilite .o { color: #f92672 } /* Operator */
        .dark .codehilite .p { color: #f8f8f2 } /* Punctuation */
        .dark .codehilite .ch { color: #75715e } /* Comment.Hashbang */
        .dark .codehilite .cm { color: #75715e } /* Comment.Multiline */
        .dark .codehilite .cp { color: #75715e } /* Comment.Preproc */
        .dark .codehilite .cpf { color: #75715e } /* Comment.PreprocFile */
        .dark .codehilite .c1 { color: #75715e } /* Comment.Single */
        .dark .codehilite .cs { color: #75715e } /* Comment.Special */
        .dark .codehilite .gd { color: #f92672 } /* Generic.Deleted */
        .dark .codehilite .ge { font-style: italic } /* Generic.Emph */
        .dark .codehilite .gi { color: #a6e22e } /* Generic.Inserted */
        .dark .codehilite .gs { font-weight: bold } /* Generic.Strong */
        .dark .codehilite .gu { color: #75715e } /* Generic.Subheading */
        .dark .codehilite .kc { color: #66d9ef } /* Keyword.Constant */
        .dark .codehilite .kd { color: #66d9ef } /* Keyword.Declaration */
        .dark .codehilite .kn { color: #f92672 } /* Keyword.Namespace */
        .dark .codehilite .kp { color: #66d9ef } /* Keyword.Pseudo */
        .dark .codehilite .kr { color: #66d9ef } /* Keyword.Reserved */
        .dark .codehilite .kt { color: #66d9ef } /* Keyword.Type */
        .dark .codehilite .ld { color: #e6db74 } /* Literal.Date */
        .dark .codehilite .m { color: #ae81ff } /* Literal.Number */
        .dark .codehilite .s { color: #e6db74 } /* Literal.String */
        .dark .codehilite .na { color: #a6e22e } /* Name.Attribute */
        .dark .codehilite .nb { color: #f8f8f2 } /* Name.Builtin */
        .dark .codehilite .nc { color: #a6e22e } /* Name.Class */
        .dark .codehilite .no { color: #66d9ef } /* Name.Constant */
        .dark .codehilite .nd { color: #a6e22e } /* Name.Decorator */
        .dark .codehilite .ni { color: #f8f8f2 } /* Name.Entity */
        .dark .codehilite .ne { color: #a6e22e } /* Name.Exception */
        .dark .codehilite .nf { color: #a6e22e } /* Name.Function */
        .dark .codehilite .nl { color: #f8f8f2 } /* Name.Label */
        .dark .codehilite .nn { color: #f8f8f2 } /* Name.Namespace */
        .dark .codehilite .nx { color: #a6e22e } /* Name.Other */
        .dark .codehilite .py { color: #f8f8f2 } /* Name.Property */
        .dark .codehilite .nt { color: #f92672 } /* Name.Tag */
        .dark .codehilite .nv { color: #f8f8f2 } /* Name.Variable */
        .dark .codehilite .ow { color: #f92672 } /* Operator.Word */
        .dark .codehilite .w { color: #f8f8f2 } /* Text.Whitespace */
        .dark .codehilite .mb { color: #ae81ff } /* Literal.Number.Bin */
        .dark .codehilite .mf { color: #ae81ff } /* Literal.Number.Float */
        .dark .codehilite .mh { color: #ae81ff } /* Literal.Number.Hex */
        .dark .codehilite .mi { color: #ae81ff } /* Literal.Number.Integer */
        .dark .codehilite .mo { color: #ae81ff } /* Literal.Number.Oct */
        .dark .codehilite .sa { color: #e6db74 } /* Literal.String.Affix */
        .dark .codehilite .sb { color: #e6db74 } /* Literal.String.Backtick */
        .dark .codehilite .sc { color: #e6db74 } /* Literal.String.Char */
        .dark .codehilite .dl { color: #e6db74 } /* Literal.String.Delimiter */
        .dark .codehilite .sd { color: #e6db74 } /* Literal.String.Doc */
        .dark .codehilite .s2 { color: #e6db74 } /* Literal.String.Double */
        .dark .codehilite .se { color: #ae81ff } /* Literal.String.Escape */
        .dark .codehilite .sh { color: #e6db74 } /* Literal.String.Heredoc */
        .dark .codehilite .si { color: #e6db74 } /* Literal.String.Interpol */
        .dark .codehilite .sx { color: #e6db74 } /* Literal.String.Other */
        .dark .codehilite .sr { color: #e6db74 } /* Literal.String.Regex */
        .dark .codehilite .s1 { color: #e6db74 } /* Literal.String.Single */
        .dark .codehilite .ss { color: #e6db74 } /* Literal.String.Symbol */
        .dark .codehilite .bp { color: #f8f8f2 } /* Name.Builtin.Pseudo */
        .dark .codehilite .fm { color: #a6e22e } /* Name.Function.Magic */
        .dark .codehilite .vc { color: #f8f8f2 } /* Name.Variable.Class */
        .dark .codehilite .vg { color: #f8f8f2 } /* Name.Variable.Global */
        .dark .codehilite .vi { color: #f8f8f2 } /* Name.Variable.Instance */
        .dark .codehilite .vm { color: #f8f8f2 } /* Name.Variable.Magic */
        .dark .codehilite .il { color: #ae81ff } /* Literal.Number.Integer.Long */
    </style>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            200: '#c7d2fe',
                            300: '#a5b4fc',
                            400: '#818cf8',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            800: '#3730a3',
                            900: '#312e81',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                        display: ['"Plus Jakarta Sans"', 'Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                        mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
                    }
                }
            }
        }
    </script>
    <script>
        // On page load or when changing themes, best to add inline in `head` to avoid FOUC
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark')
        } else {
            document.documentElement.classList.remove('dark')
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 min-h-screen font-sans selection:bg-primary-500 selection:text-white relative">
    
    <!-- Background decorations -->
    <div class="fixed inset-0 z-[-1] bg-grid-pattern opacity-[0.4] pointer-events-none mask-image-gradient"></div>
    <div class="fixed top-0 left-0 right-0 h-[500px] z-[-1] bg-gradient-to-b from-primary-100/40 to-transparent dark:from-primary-900/10 dark:to-transparent pointer-events-none"></div>

    <!-- Navbar -->
    <nav class="border-b border-gray-200/60 dark:border-gray-800/60 glass sticky top-0 z-50 transition-all duration-300">
        <div class="container mx-auto px-4 max-w-7xl">
            <div class="flex items-center justify-between h-16">
                <!-- Logo -->
                <a href="/" class="text-xl font-display font-bold text-gray-900 dark:text-white hover:text-primary-600 dark:hover:text-primary-400 transition-colors flex items-center gap-2.5 group">
                    <div class="relative flex items-center justify-center w-8 h-8 rounded-lg bg-primary-100 dark:bg-primary-900/50 text-primary-600 dark:text-primary-400 group-hover:scale-110 group-hover:rotate-3 transition-all duration-300">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                        </svg>
                    </div>
                    <span class="tracking-tight">Blog2MD</span>
                </a>

                <!-- Right Side Actions -->
                <div class="flex items-center gap-3 md:gap-4">
                    <!-- Monitor Link -->
                    <a href="/monitor" class="hidden sm:block text-sm font-medium text-gray-600 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white transition-colors">Monitor</a>

                    <!-- Fetch Button -->
                    <button onclick="openModal()" class="hidden sm:flex items-center gap-2 px-4 py-2 text-sm font-medium text-white bg-primary-600 hover:bg-primary-700 rounded-lg transition-all shadow-md hover:shadow-lg hover:-translate-y-0.5 active:translate-y-0">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                        </svg>
                        <span>Fetch URL</span>
                    </button>
                    <!-- Mobile Fetch Icon -->
                    <button onclick="openModal()" class="sm:hidden p-2 text-gray-500 hover:text-primary-600 dark:text-gray-400 dark:hover:text-primary-400 transition-colors">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                        </svg>
                    </button>

                    <div class="h-6 w-px bg-gray-200 dark:bg-gray-700"></div>

                    <!-- Theme Toggle -->
                    <button id="theme-toggle" type="button" class="text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 focus:outline-none focus:ring-4 focus:ring-gray-200 dark:focus:ring-gray-700 rounded-lg text-sm p-2.5">
                        <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
                        </svg>
                        <svg id="theme-toggle-light-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 100 2h1z" fill-rule="evenodd" clip-rule="evenodd"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mx-auto px-4 max-w-7xl py-12 min-h-[calc(100vh-160px)]">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="border-t border-gray-200/60 dark:border-gray-800/60 py-12 bg-white/50 dark:bg-gray-900/50 backdrop-blur-sm">
        <div class="container mx-auto px-4 max-w-7xl flex flex-col md:flex-row justify-between items-center gap-4">
            <p class="text-gray-500 dark:text-gray-400 text-sm">&copy; 2025 Blog2MD. Crafted for developers.</p>
            <div class="flex items-center gap-6 text-sm text-gray-500 dark:text-gray-400">
                <a href="#" class="hover:text-primary-600 dark:hover:text-primary-400 transition-colors">GitHub</a>
                <a href="#" class="hover:text-primary-600 dark:hover:text-primary-400 transition-colors">About</a>
            </div>
        </div>
    </footer>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-[100] flex flex-col space-y-3 pointer-events-none"></div>

    <!-- Fetch Modal -->
    <div id="fetchModal" class="fixed inset-0 z-50 hidden" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <!-- Background backdrop -->
        <div class="fixed inset-0 bg-gray-900/50 dark:bg-gray-900/80 backdrop-blur-sm transition-opacity" onclick="minimizeModal()"></div>

        <div class="fixed inset-0 z-10 overflow-y-auto pointer-events-none">
            <div class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0">
                <!-- Modal panel -->
                <div class="pointer-events-auto relative transform overflow-hidden rounded-lg bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-left shadow-xl transition-all sm:my-8 sm:w-full sm:max-w-xl">
                    
                    <!-- Header -->
                    <div class="bg-gray-50 dark:bg-gray-800/50 px-4 py-3 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center">
                        <h3 class="text-base font-semibold leading-6 text-gray-900 dark:text-white" id="modal-title">Fetch Article</h3>
                        <div class="flex items-center space-x-2">
                            <!-- Minimize Button -->
                            <button onclick="minimizeModal()" class="text-gray-400 hover:text-gray-500 dark:hover:text-gray-300" title="Run in Background">
                                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                                </svg>
                            </button>
                            <!-- Close Button -->
                            <button onclick="closeModal()" class="text-gray-400 hover:text-gray-500 dark:hover:text-gray-300" title="Close">
                                <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                    <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Body -->
                    <div class="px-4 py-4 sm:p-6">
                        <div id="inputSection">
                            <label for="urlInput" class="block text-sm font-medium leading-6 text-gray-700 dark:text-gray-300">Article URL</label>
                            <div class="mt-2">
                                <input type="text" name="url" id="urlInput" class="block w-full rounded-md border-0 py-2.5 px-3 text-gray-900 dark:text-white shadow-sm ring-1 ring-inset ring-gray-300 dark:ring-gray-600 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-primary-600 bg-white dark:bg-gray-700 sm:text-sm sm:leading-6" placeholder="https://...">
                            </div>
                        </div>

                        <!-- Terminal/Log Section -->
                        <div id="logSection" class="hidden mt-4">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-xs font-mono text-gray-500 dark:text-gray-400">STATUS LOG</span>
                                <span id="statusBadge" class="inline-flex items-center rounded-md bg-yellow-50 dark:bg-yellow-900/30 px-2 py-1 text-xs font-medium text-yellow-700 dark:text-yellow-500 ring-1 ring-inset ring-yellow-600/20">Running</span>
                            </div>
                            <div class="bg-gray-900 rounded-md p-4 font-mono text-xs sm:text-sm h-48 overflow-y-auto border border-gray-200 dark:border-gray-700 shadow-inner" id="logContainer">
                                <div class="text-green-500">$ init fetch_process</div>
                            </div>
                        </div>
                    </div>

                    <!-- Footer -->
                    <div class="bg-gray-50 dark:bg-gray-800/50 px-4 py-3 sm:flex sm:flex-row-reverse sm:px-6 border-t border-gray-200 dark:border-gray-700">
                        <button type="button" id="fetchBtn" onclick="startFetch()" class="inline-flex w-full justify-center rounded-md bg-primary-600 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-primary-500 sm:ml-3 sm:w-auto transition-colors">Start Fetching</button>
                        <button type="button" onclick="closeModal()" class="mt-3 inline-flex w-full justify-center rounded-md bg-white dark:bg-gray-700 px-3 py-2 text-sm font-semibold text-gray-900 dark:text-gray-200 shadow-sm ring-1 ring-inset ring-gray-300 dark:ring-gray-600 hover:bg-gray-50 dark:hover:bg-gray-600 sm:mt-0 sm:w-auto transition-colors">Cancel</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="fixed inset-0 z-50 hidden" aria-labelledby="delete-modal-title" role="dialog" aria-modal="true">
        <!-- Background backdrop -->
        <div class="fixed inset-0 bg-gray-900/50 dark:bg-gray-900/80 backdrop-blur-sm transition-opacity" onclick="closeDeleteModal()"></div>

        <div class="fixed inset-0 z-10 overflow-y-auto pointer-events-none">
            <div class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0">
                <!-- Modal panel -->
                <div class="pointer-events-auto relative transform overflow-hidden rounded-lg bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-left shadow-xl transition-all sm:my-8 sm:w-full sm:max-w-lg">
                    
                    <div class="bg-white dark:bg-gray-800 px-4 pb-4 pt-5 sm:p-6 sm:pb-4">
                        <div class="sm:flex sm:items-start">
                            <div class="mx-auto flex h-12 w-12 flex-shrink-0 items-center justify-center rounded-full bg-red-100 dark:bg-red-900/20 sm:mx-0 sm:h-10 sm:w-10">
                                <svg class="h-6 w-6 text-red-600 dark:text-red-400" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
                                </svg>
                            </div>
                            <div class="mt-3 text-center sm:ml-4 sm:mt-0 sm:text-left">
                                <h3 class="text-base font-semibold leading-6 text-gray-900 dark:text-white" id="deleteModalTitle">Delete Item</h3>
                                <div class="mt-2">
                                    <p class="text-sm text-gray-500 dark:text-gray-400 break-all" id="deleteModalMessage">Are you sure you want to delete this item? This action cannot be undone.</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="bg-gray-50 dark:bg-gray-800/50 px-4 py-3 sm:flex sm:flex-row-reverse sm:px-6 border-t border-gray-200 dark:border-gray-700">
                        <button type="button" id="deleteModalConfirmBtn" class="inline-flex w-full justify-center rounded-md bg-red-600 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-red-500 sm:ml-3 sm:w-auto transition-colors">Delete</button>
                        <button type="button" onclick="closeDeleteModal()" class="mt-3 inline-flex w-full justify-center rounded-md bg-white dark:bg-gray-700 px-3 py-2 text-sm font-semibold text-gray-900 dark:text-gray-200 shadow-sm ring-1 ring-inset ring-gray-300 dark:ring-gray-600 hover:bg-gray-50 dark:hover:bg-gray-600 sm:mt-0 sm:w-auto transition-colors">Cancel</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- Delete Modal Logic ---
        let confirmDeleteCallback = null;

        function openDeleteModal(title, message, onConfirm) {
            document.getElementById('deleteModalTitle').textContent = title;
            document.getElementById('deleteModalMessage').textContent = message;
            confirmDeleteCallback = onConfirm;
            document.getElementById('deleteModal').classList.remove('hidden');
        }

        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.add('hidden');
            confirmDeleteCallback = null;
        }

        document.getElementById('deleteModalConfirmBtn').addEventListener('click', function() {
            if (confirmDeleteCallback) {
                confirmDeleteCallback();
            }
            closeDeleteModal();
        });

        // --- State Management ---
        let isTaskRunning = false;
        let ws = null;

        // --- Theme Toggle Logic ---
        var themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
        var themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');

        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            themeToggleLightIcon.classList.remove('hidden');
        } else {
            themeToggleDarkIcon.classList.remove('hidden');
        }

        var themeToggleBtn = document.getElementById('theme-toggle');
        themeToggleBtn.addEventListener('click', function() {
            themeToggleDarkIcon.classList.toggle('hidden');
            themeToggleLightIcon.classList.toggle('hidden');
            if (localStorage.theme === 'dark') {
                document.documentElement.classList.remove('dark');
                localStorage.theme = 'light';
            } else {
                document.documentElement.classList.add('dark');
                localStorage.theme = 'dark';
            }
        });

        // --- Global WebSocket Logic ---
        function initWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws/notify`);

            ws.onopen = function() {
                console.log("Connected to notification server.");
            };

            ws.addEventListener('message', function(event) {
                const msg = event.data;
                
                // Parse LOG:task_id:content or UPDATE:task_id:status
                if (msg.startsWith('LOG:')) {
                    // Format: LOG:task_id:content
                    const firstColon = msg.indexOf(':');
                    const secondColon = msg.indexOf(':', firstColon + 1);
                    if (secondColon !== -1) {
                        const taskId = msg.substring(firstColon + 1, secondColon);
                        const content = msg.substring(secondColon + 1);
                        
                        if (currentTaskId && taskId === currentTaskId) {
                            appendLog(content);
                        }
                    }
                } else if (msg.startsWith('UPDATE:')) {
                    // Format: UPDATE:task_id:status
                    const parts = msg.split(':');
                    if (parts.length >= 3) {
                        const taskId = parts[1];
                        const status = parts[2]; // pending, running, completed, failed
                        
                        if (currentTaskId && taskId === currentTaskId) {
                            if (status === 'completed') {
                                handleTaskComplete(true, "Success");
                            } else if (status === 'failed') {
                                handleTaskComplete(false, "Task failed. Check logs.");
                            }
                        }
                    }
                }
            });

            ws.onclose = function() {
                // Try to reconnect after 5s
                setTimeout(initWebSocket, 5000);
            };
        }

        // Initialize on load
        initWebSocket();

        // --- Toast Logic ---
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let bgClass = 'bg-gray-800 dark:bg-gray-700 text-white';
            let icon = '';
            
            if (type === 'success') {
                bgClass = 'bg-green-600 text-white';
                icon = '<svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>';
            } else if (type === 'error') {
                bgClass = 'bg-red-600 text-white';
                icon = '<svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>';
            } else if (type === 'warning') {
                bgClass = 'bg-yellow-500 text-white';
                icon = '<svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>';
            }

            toast.className = `${bgClass} px-4 py-3 rounded-lg shadow-lg flex items-center transform transition-all duration-300 translate-y-2 opacity-0 pointer-events-auto min-w-[300px]`;
            toast.innerHTML = `${icon}<span class="font-medium text-sm">${message}</span>`;
            
            container.appendChild(toast);
            
            // Animate in
            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            });

            // Remove after 5s
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 5000);
        }

        // --- Modal & Task Logic ---

        function openModal() {
            document.getElementById('fetchModal').classList.remove('hidden');
            if (isTaskRunning) {
                // Show Logs
                document.getElementById('inputSection').classList.add('hidden');
                document.getElementById('logSection').classList.remove('hidden');
            } else {
                // Show Input
                // Don't clear logs if we want to see previous result, unless we reset
                // But for now, let's keep input visible if not running
                if(document.getElementById('fetchBtn').innerText !== "Refresh Page") {
                    document.getElementById('inputSection').classList.remove('hidden');
                    document.getElementById('logSection').classList.add('hidden');
                }
            }
        }

        function minimizeModal() {
            document.getElementById('fetchModal').classList.add('hidden');
            if (isTaskRunning) {
                showToast("Task running in background...", "info");
            }
        }

        function closeModal() {
            if (isTaskRunning) {
                // Automatically minimize to background if task is running
                minimizeModal();
                return;
            }
            document.getElementById('fetchModal').classList.add('hidden');
            resetModal();
        }

        function resetModal() {
            document.getElementById('inputSection').classList.remove('hidden');
            document.getElementById('logSection').classList.add('hidden');
            document.getElementById('logContainer').innerHTML = '<div class="text-green-500">$ init fetch_process</div>';
            document.getElementById('urlInput').value = '';
            document.getElementById('urlInput').classList.remove('ring-red-500', 'focus:ring-red-500'); // Reset error state
            
            const btn = document.getElementById('fetchBtn');
            btn.disabled = false;
            btn.innerText = "Start Fetching";
            btn.classList.remove('bg-green-600', 'hover:bg-green-700');
            btn.classList.add('bg-primary-600', 'hover:bg-primary-700');
            btn.onclick = startFetch;
            
            isTaskRunning = false;
        }
        
        // ... (other functions) ...

        async function startFetch() {
            const urlInput = document.getElementById('urlInput');
            const url = urlInput.value.trim();
            
            // URL Validation
            const urlPattern = /^(http|https):\/\/[^ "]+$/;
            
            if (!url || !urlPattern.test(url)) {
                showToast("Please enter a valid URL (starting with http:// or https://)", "error");
                urlInput.classList.add('ring-red-500', 'focus:ring-red-500');
                urlInput.focus();
                return;
            }
            
            // Clear error style if valid
            urlInput.classList.remove('ring-red-500', 'focus:ring-red-500');

            // Reset UI
            document.getElementById('inputSection').classList.add('hidden');
            document.getElementById('logSection').classList.remove('hidden');
            document.getElementById('logContainer').innerHTML = '<div class="text-green-500">$ init fetch_process</div>';
            
            const btn = document.getElementById('fetchBtn');
            btn.disabled = true;
            btn.innerText = "Processing...";
            
            document.getElementById('statusBadge').className = "inline-flex items-center rounded-md bg-yellow-50 dark:bg-yellow-900/30 px-2 py-1 text-xs font-medium text-yellow-700 dark:text-yellow-500 ring-1 ring-inset ring-yellow-600/20";
            document.getElementById('statusBadge').innerText = "Running";

            isTaskRunning = true;
            
            try {
                const response = await fetch('/api/fetch', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ url: url }),
                });

                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                
                appendLog("Task submitted to background...");
                
            } catch (error) {
                handleTaskComplete(false, error.message);
            }
        }
    </script>
</body>
</html>
